plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '0.9.0'
group = 'dev.rs2multifilter'
base { archivesName = 'rs2multifilter' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        rs2multifilter { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.rs2multifilter
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Refined Storage'
        url = 'https://maven.creeperhost.net'
        content { includeGroup('com.refinedmods.refinedstorage') }
    }
}

dependencies {
    implementation 'com.refinedmods.refinedstorage:refinedstorage-neoforge:2.0.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property('modVersion', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    from('LICENSE') { into 'META-INF' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
    from('docs/TEXTURE_PROVENANCE.md') { into 'META-INF/docs' }
}

// Explicit CI-only probe. Its classes are not part of the production JAR.
if (providers.gradleProperty('clientSmoke').getOrElse('false') == 'true') {
    sourceSets.create('clientSmoke') {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    neoForge.mods.rs2multifilter.sourceSet(sourceSets.clientSmoke)
}
