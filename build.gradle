plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '0.9.0-alpha'
group = 'dev.rs2multifilter'
base { archivesName = 'rs2multifilter' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        rs2multifilter { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.rs2multifilter
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Refined Storage'
        url = 'https://maven.creeperhost.net'
        content { includeGroup('com.refinedmods.refinedstorage') }
    }
}

dependencies {
    implementation 'com.refinedmods.refinedstorage:refinedstorage-neoforge:2.0.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

test {
    useJUnitPlatform()
}
