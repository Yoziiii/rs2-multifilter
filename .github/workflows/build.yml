name: NeoForge 1.21.1 Build
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: rs2-multifilter-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile and test
        run: gradle build --stacktrace
      - name: Verify packaged NeoForge mod
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name 'rs2multifilter-*.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -Fq 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fq 'rs2multifilter.mixins.json'
          jar tf "$JAR" | grep -Fq 'dev/rs2multifilter/minecraft/MultiFilterMod.class'
          jar tf "$JAR" | grep -Fq 'dev/rs2multifilter/minecraft/client/GridFilterSession.class'
          jar tf "$JAR" | grep -Fq 'data/rs2multifilter/recipe/copy_filter_card.json'
      - name: Headless NeoForge server smoke test
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 150s gradle runServer --console=plain > server-smoke.log 2>&1
          RESULT=$?
          set -e
          tail -n 120 server-smoke.log
          if grep -Eiq 'Done \(|For help, type|Preparing spawn area' server-smoke.log; then
            echo "NeoForge reached Minecraft server initialization."
            exit 0
          fi
          echo "Server did not reach expected startup markers (exit=$RESULT)."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: rs2multifilter-jar
          path: build/libs/*.jar
          if-no-files-found: error
