name: NeoForge 1.21.1 Build
on:
  workflow_dispatch:
  push:
    branches: [main, codex/create-menu-phase1, codex/interaction-phase2, codex/create-ui-phase3, codex/create-interaction-rework]

concurrency:
  group: rs2-multifilter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile and test
        run: gradle build --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: ignore
      - name: Verify packaged NeoForge mod
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name 'rs2multifilter-*.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -Fq 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fq 'rs2multifilter.mixins.json'
          jar tf "$JAR" | grep -Fq 'dev/rs2multifilter/minecraft/MultiFilterMod.class'
          jar tf "$JAR" | grep -Fq 'dev/rs2multifilter/minecraft/client/GridFilterSession.class'
          jar tf "$JAR" | grep -Fq 'dev/rs2multifilter/minecraft/mixin/GridCardStorageMixin.class'
          jar tf "$JAR" | grep -Fq 'data/rs2multifilter/recipe/copy_filter_card.json'
      - name: Headless NeoForge server smoke test
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          timeout 180s gradle runServer --console=plain > server-smoke.log 2>&1 &
          SERVER_PID=$!
          STARTED=0
          for step in $(seq 1 105); do
            if grep -Fq 'Done (' server-smoke.log; then
              STARTED=1
              break
            fi
            if grep -Fq 'Failed to start the minecraft server' server-smoke.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          tail -n 90 server-smoke.log
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$STARTED" = "1" ]; then
            echo "NeoForge server fully started (Done)."
            exit 0
          fi
          echo "NeoForge server failed to reach Done."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: rs2multifilter-jar
          path: build/libs/*.jar
          if-no-files-found: error
